---
spring:
  application:
    name: config-service-test
  profiles:
    active: test
  cloud:
    config:
      server:
        git:
          uri: file:///e:/101/config-repo
          search-paths:
          - '{application}'
          clone-true-start: true
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
server:
  port: 8889
logging:
  level:
    root: INFO
    org.springframework.cloud: DEBUG
    com.inventory: DEBUG
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
