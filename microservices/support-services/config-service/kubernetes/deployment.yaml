apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: inventory
  labels:
    app: config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: config-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: config-service
        image: ghcr.io/inventory-management-system/config-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8888
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "native"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "128Mi"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /var/log/app
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8888
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8888
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: inventory
  labels:
    app: config-service
spec:
  type: ClusterIP
  selector:
    app: config-service
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-service-config
  namespace: inventory
data:
  application.yml: |
    server:
      port: 8888
    spring:
      application:
        name: config-service
      profiles:
        active: native
      cloud:
        config:
          server:
            native:
              search-locations: classpath:/config/
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: when-authorized
          probes:
            enabled: true
