---
spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: support-api-gateway
        metadata:
          version: 3.0.0
          env: ${SPRING_PROFILES_ACTIVE:dev}
          service-type: microservice
          framework: spring-boot
          language: java
          team: inventory-management
          region: default
          zone: default
          stage: ${SPRING_PROFILES_ACTIVE:dev}
          gray: false
          weight: 1.0
      config:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: support-api-gateway
        file-extension: yml
        refresh-enabled: true
        encode: UTF-8
    gateway:
      routes:
      - id: http-to-https-redirect
        uri: https://localhost:443
        predicates:
        - Path=/**
        - Header=X-Forwarded-Proto, http
        filters:
        - RedirectTo=301, https://${host}/#{request.path()}
      - id: admin-service
        uri: lb://admin-service
        predicates:
        - Path=/api/v1/admin/**
        filters:
        - RewritePath=/api/v1/admin/(?<segment>.*), /api/v1/${segment}
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: '#{@apiKeyResolver}'
        - name: CircuitBreaker
          args:
            name: adminServiceCircuitBreaker
            fallbackUri: forward:/fallback/admin
      - id: product-service
        uri: lb://product-service
        predicates:
        - Path=/api/v1/products/**
        filters:
        - RewritePath=/api/v1/products/(?<segment>.*), /api/v1/products/${segment}
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            redis-rate-limiter.requestedTokens: 1
            key-resolver: '#{@apiKeyResolver}'
        - name: CircuitBreaker
