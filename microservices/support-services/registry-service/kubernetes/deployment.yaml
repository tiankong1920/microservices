apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-service
  namespace: inventory
  labels:
    app: registry-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: registry-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: registry-service
        image: ghcr.io/inventory-management-system/registry-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8761
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "128Mi"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /var/log/app
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8761
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: inventory
  labels:
    app: registry-service
spec:
  type: ClusterIP
  selector:
    app: registry-service
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-service-config
  namespace: inventory
data:
  application.yml: |
    server:
      port: 8761
    spring:
      application:
        name: registry-service
      profiles:
        active: prod
    eureka:
      server:
        enable-self-preservation: true
        renewal-percent-threshold: 0.85
      instance:
        hostname: registry-service
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: when-authorized
          probes:
            enabled: true
