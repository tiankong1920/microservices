global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@inventory-system.com'
  smtp_auth_username: 'alertmanager@inventory-system.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'
    - match:
        alertname: ServiceDown
      receiver: 'service-down-receiver'
    - match:
        alertname: DatabaseConnectionsExhausted
      receiver: 'database-receiver'
    - match:
        alertname: RedisDown
      receiver: 'cache-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://notification-service:8080/api/notifications/alerts'
        send_resolved: true

  - name: 'critical-receiver'
    email_configs:
      - to: 'ops-critical@example.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: |
          <h2>Critical Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Details:</strong></p>
          {{ range .Alerts }}
          <ul>
            <li><strong>Instance:</strong> {{ .Labels.instance }}</li>
            <li><strong>Summary:</strong> {{ .Annotations.summary }}</li>
            <li><strong>Description:</strong> {{ .Annotations.description }}</li>
            <li><strong>Starts At:</strong> {{ .StartsAt }}</li>
          </ul>
          {{ end }}
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        color: 'danger'
    webhook_configs:
      - url: 'http://notification-service:8080/api/notifications/alerts/critical'
        send_resolved: true

  - name: 'warning-receiver'
    email_configs:
      - to: 'ops-warning@example.com'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'
        html: |
          <h2>Warning Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Details:</strong></p>
          {{ range .Alerts }}
          <ul>
            <li><strong>Instance:</strong> {{ .Labels.instance }}</li>
            <li><strong>Summary:</strong> {{ .Annotations.summary }}</li>
            <li><strong>Description:</strong> {{ .Annotations.description }}</li>
          </ul>
          {{ end }}
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warning'
        title: 'WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        color: 'warning'

  - name: 'service-down-receiver'
    email_configs:
      - to: 'ops-oncall@example.com'
        headers:
          Subject: '[URGENT] Service Down: {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        title: 'SERVICE DOWN'
        text: '{{ range .Alerts }}Service {{ .Labels.instance }} is down!{{ end }}'
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}'

  - name: 'database-receiver'
    email_configs:
      - to: 'dba@example.com'
        headers:
          Subject: '[DATABASE] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#database-alerts'
        title: 'DATABASE ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        color: 'danger'

  - name: 'cache-receiver'
    email_configs:
      - to: 'cache-admin@example.com'
        headers:
          Subject: '[CACHE] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#cache-alerts'
        title: 'CACHE ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        color: 'danger'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'HighMemoryUsage'
    equal: ['instance']
  - source_match:
      alertname: 'DatabaseConnectionsExhausted'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['instance']
