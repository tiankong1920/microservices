global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'inventory-management-system'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  - job_name: 'gateway-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'gateway-service:8080'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'gateway-service'

  - job_name: 'product-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'product-service:8081'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'product-service'

  - job_name: 'order-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'order-service:8082'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'order-service'

  - job_name: 'inventory-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'inventory-service:8083'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'inventory-service'

  - job_name: 'procurement-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'procurement-service:8085'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'procurement-service'

  - job_name: 'business-partner-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'business-partner-service:8088'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'business-partner-service'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  - job_name: 'redis-exporter'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  - job_name: 'nacos'
    metrics_path: /nacos/actuator/prometheus
    static_configs:
      - targets:
          - 'nacos:8848'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
