groups:
  - name: service_health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: ServiceHighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.instance }}"
          description: "95th percentile latency is above 2 seconds for {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for more than 5 minutes"

  - name: jvm_metrics
    rules:
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap memory usage on {{ $labels.instance }}"
          description: "JVM heap memory usage is above 85% for {{ $labels.instance }}"

      - alert: CriticalMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical JVM heap memory usage on {{ $labels.instance }}"
          description: "JVM heap memory usage is above 95% for {{ $labels.instance }}"

      - alert: HighGCOverhead
        expr: rate(jvm_gc_pause_seconds_sum[5m]) / rate(jvm_gc_pause_seconds_count[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GC overhead on {{ $labels.instance }}"
          description: "GC is taking more than 500ms on average for {{ $labels.instance }}"

      - alert: LowThreadCount
        expr: jvm_threads_daemon_threads < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low thread count on {{ $labels.instance }}"
          description: "Daemon thread count is below 10 for {{ $labels.instance }}"

  - name: database_metrics
    rules:
      - alert: DatabaseConnectionsHigh
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection usage on {{ $labels.instance }}"
          description: "Database connection pool usage is above 80% for {{ $labels.instance }}"

      - alert: DatabaseConnectionsExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted on {{ $labels.instance }}"
          description: "Database connection pool usage is above 95% for {{ $labels.instance }}"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance is not responding"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high connection count"
          description: "PostgreSQL connection usage is above 80%"

  - name: redis_metrics
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance is not responding"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 85%"

      - alert: RedisHighConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis high connection count"
          description: "Redis has more than 100 connected clients"

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis rejected connections"
          description: "Redis is rejecting connections due to maxclients limit"

  - name: circuit_breaker
    rules:
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker open for {{ $labels.name }}"
          description: "Circuit breaker {{ $labels.name }} is in open state"

      - alert: CircuitBreakerHalfOpen
        expr: resilience4j_circuitbreaker_state{state="half_open"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker half-open for {{ $labels.name }}"
          description: "Circuit breaker {{ $labels.name }} is in half-open state"

      - alert: HighFailureRate
        expr: resilience4j_circuitbreaker_failure_rate > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High failure rate for {{ $labels.name }}"
          description: "Circuit breaker {{ $labels.name }} has failure rate above 50%"

  - name: system_metrics
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for {{ $labels.instance }}"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95% for {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is above 85% for {{ $labels.instance }}"

      - alert: CriticalDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk usage on {{ $labels.instance }}"
          description: "Disk usage is above 95% for {{ $labels.instance }}"

      - alert: ContainerRestartingFrequently
        expr: increase(container_restart_count[1h]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting frequently"
          description: "Container {{ $labels.name }} has restarted more than 5 times in the last hour"

  - name: business_metrics
    rules:
      - alert: LowOrderRate
        expr: sum(rate(http_server_requests_seconds_count{uri="/api/orders", method="POST"}[1h])) < 0.01
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Low order creation rate"
          description: "Order creation rate is unusually low"

      - alert: HighOrderFailureRate
        expr: sum(rate(http_server_requests_seconds_count{uri="/api/orders", method="POST", status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{uri="/api/orders", method="POST"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High order failure rate"
          description: "Order creation failure rate is above 10%"

      - alert: InventoryLowStock
        expr: inventory_quantity_total{status="low"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low inventory alert"
          description: "Some products have low inventory levels"

      - alert: InventoryCriticalStock
        expr: inventory_quantity_total{status="critical"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical inventory alert"
          description: "Some products have critical inventory levels"

      - alert: HighOrderProcessingTime
        expr: histogram_quantile(0.95, sum(rate(order_processing_duration_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High order processing time"
          description: "Order processing is taking longer than expected"

      - alert: PaymentFailureRate
        expr: sum(rate(payment_failures_total[5m])) / sum(rate(payment_attempts_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is above 5%"

      - alert: PaymentTimeout
        expr: payment_timeout_total > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Payment timeout detected"
          description: "Payment timeouts are occurring"

      - alert: SupplierDeliveryDelay
        expr: supplier_delivery_delay_hours > 24
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Supplier delivery delay"
          description: "Supplier deliveries are delayed by more than 24 hours"

      - alert: CustomerCreationFailure
        expr: sum(rate(customer_creation_failures_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High customer creation failure rate"
          description: "Customer creation is failing frequently"

      - alert: DatasourceConnectionFailures
        expr: sum(rate(datasource_connection_failures_total[5m])) / sum(rate(datasource_connection_attempts_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High datasource connection failure rate"
          description: "Datasource connections are failing frequently"

      - alert: TemplateExportFailure
        expr: sum(rate(template_export_failures_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Template export failures"
          description: "Template exports are failing"

      - alert: BusinessPartnerSyncFailure
        expr: business_partner_sync_failures > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business partner sync failure"
          description: "Business partner synchronization is failing"
