sonar.projectKey=datasource-service
sonar.projectName=Datasource Service
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.jacoco.reportPaths=build/jacoco/test.exec
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

sonar.java.checkstyle.reportPaths=build/reports/checkstyle/main.xml
sonar.java.spotbugs.reportPaths=build/reports/spotbugs/main.xml

sonar.coverage.exclusions=**/dto/**,**/entity/**,**/repository/**,**/*Application.java,**/*Config.java,**/*Constants.java
sonar.test.exclusions=**/test/**,**/*Test.java,**/*Tests.java

sonar.coverage.minimum=64

sonar.issue.ignore.multicriteria=e1,e2,e3

sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test/**/*Test.java

sonar.issue.ignore.multicriteria.e2.ruleKey=java:S5786
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test/**/*Test.java

sonar.issue.ignore.multicriteria.e3.ruleKey=java:S2699
sonar.issue.ignore.multicriteria.e3.resourceKey=**/test/**/*Test.java
