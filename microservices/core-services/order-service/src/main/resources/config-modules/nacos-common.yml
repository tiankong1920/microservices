---
# Nacos公共配置
# 功能描述:包含Nacos服务发现和配置中心的公共配置
# 适用范围:所有使用Nacos的服务
# 修改记录:
# - 2025-02-05 修复模块联动

spring:
  cloud:
    nacos:
      # 服务发现公共配置
      discovery:
        # Nacos服务器地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        
        # Nacos命名空间
        namespace: ${NACOS_NAMESPACE:public}
        
        # 服务元数据
        metadata:
          version: 3.0.0
          env: ${SPRING_PROFILES_ACTIVE:dev}
          service-type: microservice
          framework: spring-boot
          language: java
          team: inventory-management
          region: default
          zone: default
          stage: ${SPRING_PROFILES_ACTIVE:dev}
          gray: false
          weight: 1.0
      
      # 配置中心公共配置
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yml
        refresh-enabled: true
        encode: UTF-8
