apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: inventory
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: product-service
        image: ghcr.io/inventory-management-system/product-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        - name: NACOS_SERVER_ADDR
          value: "nacos:8848"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-config
              key: host
              optional: true
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-config
              key: port
              optional: true
        - name: DB_NAME
          value: "inventory_product_db"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: username
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: password
              optional: true
        - name: REDIS_HOST
          value: "redis:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "128Mi"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /var/log/app
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: inventory
  labels:
    app: product-service
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: inventory
data:
  application.yml: |
    server:
      port: 8081
    spring:
      application:
        name: product-service
      profiles:
        active: prod
      cloud:
        nacos:
          discovery:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
          config:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      health:
        redis:
          enabled: true
        prometheus:
          enabled: true
      endpoint:
        health:
          show-details: when-authorized
          probes:
            enabled: true
---
# Required Secrets (create manually or via external-secrets):
