apiVersion: 1

datasources:
  datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://localhost:9090
      isDefault: true

dashboardProviders:
  - name: Grafana
      type: file
      disableDeletion: false
      allowUiUpdates: true
      options:
        path: /etc/grafana/provisioning/dashboards

dashboards:
  - name: Inventory Management Dashboard
      file: /etc/grafana/provisioning/dashboards/inventory-dashboard.json
      overwrite: true

  - name: System Monitoring Dashboard  
      file: /etc/grafana/provisioning/dashboards/system-dashboard.json
      overwrite: true

  - name: Application Metrics Dashboard
      file: /etc/grafana/provisioning/dashboards/metrics-dashboard.json
      overwrite: true

variables:
  prometheus_data_source: Prometheus
  prometheus_url: http://localhost:9090
  grafana_url: http://localhost:3000