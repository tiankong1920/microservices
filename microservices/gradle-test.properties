org.gradle.jvmargs=-Xmx4g -Xms1g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

org.gradle.debug=false
org.gradle.profiling=false

spring.profiles.active=test
spring.cloud.config.enabled=false

logging.level.root=INFO
logging.level.com.inventory=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

server.port=8080

eureka.client.enabled=false

database.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
database.username=sa
database.password=
database.driver-class-name=org.h2.Driver

redis.host=localhost
redis.port=6379
redis.password=
redis.database=1

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
