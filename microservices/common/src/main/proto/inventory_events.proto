syntax = "proto3";

package com.inventory.common.protobuf;

option java_multiple_files = true;
option java_package = "com.inventory.common.protobuf";
option java_outer_classname = "InventoryEventsProto";

// Common message headers
message EventHeader {
  string event_id = 1;
  string event_type = 2;
  string source_service = 3;
  string timestamp = 4;
  string correlation_id = 5;
  map<string, string> metadata = 6;
}

// Product-related messages
message Product {
  string product_id = 1;
  string product_name = 2;
  string description = 3;
  string category = 4;
  string brand = 5;
  double unit_price = 6;
  int32 stock_quantity = 7;
  bool is_active = 8;
  string sku = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ProductCreateRequest {
  string product_name = 1;
  string description = 2;
  string category = 3;
  string brand = 4;
  double unit_price = 5;
  int32 initial_stock = 6;
  string sku = 7;
}

message ProductUpdateRequest {
  string product_id = 1;
  optional string product_name = 2;
  optional string description = 3;
  optional string category = 4;
  optional string brand = 5;
  optional double unit_price = 6;
  optional int32 stock_quantity = 7;
  optional bool is_active = 8;
  optional string sku = 9;
}

message ProductDeleteRequest {
  string product_id = 1;
  bool force_delete = 2;
}

// Inventory-related messages
message InventoryUpdate {
  string product_id = 1;
  int32 change_quantity = 2;
  string reason = 3;
  string reference_id = 4;
  string reference_type = 5;
  string updated_by = 6;
}

message StockLevel {
  string product_id = 1;
  int32 current_stock = 2;
  int32 min_stock_threshold = 3;
  int32 max_stock_threshold = 4;
  string last_updated = 5;
}

message LowStockAlert {
  string product_id = 1;
  int32 current_stock = 2;
  int32 min_stock_threshold = 3;
  string alert_level = 4;
  string created_at = 5;
}

// Order-related messages
message Order {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
  string order_status = 5;
  string created_at = 6;
  string updated_at = 7;
  string payment_id = 8;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  double unit_price = 3;
  double total_price = 4;
  string sku = 5;
}

message OrderCreatedEvent {
  EventHeader header = 1;
  Order order = 2;
}

message OrderUpdatedEvent {
  EventHeader header = 1;
  Order order = 2;
  string previous_status = 3;
}

message OrderCancelledEvent {
  EventHeader header = 1;
  string order_id = 2;
  string cancellation_reason = 3;
  string cancelled_at = 4;
}

// Inventory transaction messages
message InventoryTransaction {
  string transaction_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  string transaction_type = 4; // INBOUND, OUTBOUND, ADJUSTMENT
  string reference_id = 5;
  string reference_type = 6;
  string created_at = 7;
  string processed_by = 8;
  bool is_reconciled = 9;
}

// Common response messages
message Acknowledgment {
  string event_id = 1;
  bool success = 2;
  string message = 3;
  map<string, string> metadata = 4;
}

message ErrorResponse {
  string error_code = 1;
  string error_message = 2;
  string event_id = 3;
  map<string, string> error_details = 4;
}

// Key rotation notification message
message KeyRotationNotification {
  EventHeader header = 1;
  string secret_path = 2;
  string key_name = 3;
  string rotation_type = 4; // SCHEDULED, EVENT_TRIGGERED, MANUAL
  string rotated_at = 5;
  string previous_value_hash = 6;
  bool notification_sent = 7;
}
