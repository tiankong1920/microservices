---
# Nacos公共配置
# 功能描述：包含Nacos服务发现和配置中心的公共配置
# 适用范围：所有使用Nacos的服务
# 修改记录：
# - 2025-12-28 架构师团队：初始配置

spring:
  cloud:
    nacos:
      # 服务发现公共配置
      discovery:
        # Nacos服务器地址
        # 功能描述：指定Nacos服务注册中心的地址
        # 允许取值范围：有效的IP:端口格式
        # 默认值：localhost:8848
        # 注意事项：生产环境需配置真实的Nacos集群地址
        server-addr: localhost:8848
        
        # Nacos命名空间
        # 功能描述：指定服务注册的命名空间
        # 允许取值范围：有效的命名空间ID或名称
        # 默认值：${NACOS_NAMESPACE:public}
        # 注意事项：用于多环境隔离
        namespace: ${NACOS_NAMESPACE:public}
        
        # 服务元数据
        # 功能描述：定义服务的附加元数据信息
        # 允许取值范围：键值对格式
        # 默认值：无
        # 注意事项：用于服务路由、负载均衡等场景
        metadata:
          # 服务版本
          # 功能描述：定义服务的版本号
          # 允许取值范围：有效的版本字符串
          # 默认值：3.0.0
          # 注意事项：需与实际服务版本保持一致
          version: 3.0.0
          
          # 环境
          # 功能描述：定义服务部署的环境
          # 允许取值范围：dev（开发）、test（测试）、staging（预发布）、prod（生产）
          # 默认值：${SPRING_PROFILES_ACTIVE:dev}
          # 注意事项：与Spring profiles保持一致
          env: ${SPRING_PROFILES_ACTIVE:dev}
          
          # 服务类型
          # 功能描述：定义服务的类型
          # 允许取值范围：microservice、api-gateway、config-server等
          # 默认值：microservice
          # 注意事项：用于服务分类
          service-type: microservice
          
          # 框架
          # 功能描述：定义服务使用的框架
          # 允许取值范围：spring-boot、spring-cloud等
          # 默认值：spring-boot
          # 注意事项：用于服务技术栈标识
          framework: spring-boot
          
          # 开发语言
          # 功能描述：定义服务使用的开发语言
          # 允许取值范围：java、python、go等
          # 默认值：java
          # 注意事项：用于服务技术栈标识
          language: java
          
          # 团队
          # 功能描述：定义负责服务的团队
          # 允许取值范围：任意字符串
          # 默认值：inventory-management
          # 注意事项：用于监控和告警
          team: inventory-management
          
          # 区域
          # 功能描述：定义服务部署的区域
          # 允许取值范围：任意字符串
          # 默认值：default
          # 注意事项：用于多区域部署
          region: default
          
          # 可用区
          # 功能描述：定义服务部署的可用区
          # 允许取值范围：任意字符串
          # 默认值：default
          # 注意事项：用于高可用部署
          zone: default
          
          # 阶段
          # 功能描述：定义服务部署的阶段
          # 允许取值范围：dev（开发）、test（测试）、staging（预发布）、prod（生产）
          # 默认值：${SPRING_PROFILES_ACTIVE:dev}
          # 注意事项：与环境保持一致
          stage: ${SPRING_PROFILES_ACTIVE:dev}
          
          # 灰度标识
          # 功能描述：标识服务是否为灰度版本
          # 允许取值范围：true（是）、false（否）
          # 默认值：false
          # 注意事项：用于灰度发布
          gray: false
          
          # 权重
          # 功能描述：定义服务的负载均衡权重
          # 允许取值范围：0.0~1.0
          # 默认值：1.0
          # 注意事项：用于基于权重的负载均衡
          weight: 1.0
      
      # 配置中心公共配置
      config:
        # Nacos服务器地址
        # 功能描述：指定Nacos配置中心的地址
        # 允许取值范围：有效的IP:端口格式
        # 默认值：localhost:8848
        # 注意事项：与discovery.server-addr保持一致
        server-addr: localhost:8848
        
        # Nacos命名空间
        # 功能描述：指定配置的命名空间
        # 允许取值范围：有效的命名空间ID或名称
        # 默认值：${NACOS_NAMESPACE:public}
        # 注意事项：与discovery.namespace保持一致
        namespace: ${NACOS_NAMESPACE:public}
        
        # 配置文件扩展名
        # 功能描述：指定配置文件的扩展名
        # 允许取值范围：yml、yaml、properties
        # 默认值：yml
        # 注意事项：建议使用yml格式，更便于阅读
        file-extension: yml
        
        # 动态刷新开关
        # 功能描述：是否启用配置的动态刷新
        # 允许取值范围：true（启用）、false（禁用）
        # 默认值：true
        # 注意事项：启用后配置变更无需重启应用
        refresh-enabled: true
        
        # 配置编码格式
        # 功能描述：指定配置文件的编码格式
        # 允许取值范围：UTF-8、GBK等
        # 默认值：UTF-8
        # 注意事项：建议使用UTF-8编码
        encode: UTF-8