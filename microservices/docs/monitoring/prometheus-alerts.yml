groups:
  - name: spring-cloud-alerts
    rules:
      - alert: ServiceDown
        expr: up{job="inventory-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
      
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
      
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{name="state",state="OPEN"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is OPEN"
