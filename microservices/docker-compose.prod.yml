      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 30s
      update_config:
        parallelism: 1
        delay: 60s
        failure_action: rollback
      resources:
