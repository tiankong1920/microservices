        delay: 60s
        failure_action: rollback
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - inventory-net-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
