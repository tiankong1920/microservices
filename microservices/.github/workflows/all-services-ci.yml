name: All Services CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      core-services: ${{ steps.filter.outputs.core-services }}
      support-services: ${{ steps.filter.outputs.support-services }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-services:
              - 'core-services/**'
            support-services:
              - 'support-services/**'
            common:
              - 'common/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'

  core-services:
    name: Core Service - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.core-services == 'true' || needs.detect-changes.outputs.common == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - order-service
          - inventory-service
          - sales-service
          - procurement-service
          - customer-service
          - supplier-service
          - datasource-service
          - template-service
          - mall-service
          - business-partner-service
          - invoice-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :core-services:${{ matrix.service }}:compileJava --no-daemon

      - name: Run tests
        run: ./gradlew :core-services:${{ matrix.service }}:test --no-daemon

      - name: Generate coverage report
        run: ./gradlew :core-services:${{ matrix.service }}:jacocoTestReport --no-daemon
        continue-on-error: true

      - name: Verify coverage
        run: ./gradlew :core-services:${{ matrix.service }}:jacocoTestCoverageVerification --no-daemon
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            core-services/${{ matrix.service }}/build/reports/tests/test/
            core-services/${{ matrix.service }}/build/reports/jacoco/test/
          retention-days: 7

  support-services:
    name: Support Service - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.support-services == 'true' || needs.detect-changes.outputs.common == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - gateway-service
          - finance-service
          - report-service
          - registry-service
          - config-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :support-services:${{ matrix.service }}:compileJava --no-daemon

      - name: Run tests
        run: ./gradlew :support-services:${{ matrix.service }}:test --no-daemon

      - name: Generate coverage report
        run: ./gradlew :support-services:${{ matrix.service }}:jacocoTestReport --no-daemon
        continue-on-error: true

      - name: Verify coverage
        run: ./gradlew :support-services:${{ matrix.service }}:jacocoTestCoverageVerification --no-daemon
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            support-services/${{ matrix.service }}/build/reports/tests/test/
            support-services/${{ matrix.service }}/build/reports/jacoco/test/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [core-services, support-services]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [core-services, support-services]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Core services: ${{ needs.core-services.result }}"
          echo "Support services: ${{ needs.support-services.result }}"
          if [ "${{ needs.core-services.result }}" == "failure" ] || [ "${{ needs.support-services.result }}" == "failure" ]; then
            echo "::error::One or more services failed"
            exit 1
          fi
          echo "All services passed!"
