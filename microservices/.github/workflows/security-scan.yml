name: Security Scan

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.java'
      - '**.gradle'
      - 'pom.xml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * 1'

env:
  JAVA_VERSION: '17'

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Run OWASP Dependency Check
        run: |
          ./gradlew dependencyCheckAnalyze --no-build-cache
        continue-on-error: true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
          retention-days: 30

      - name: Fail on high vulnerabilities
        if: always()
        run: |
          if grep -q '<high count="[5-9]"\|<high count="[0-9]{2,}"' build/reports/dependency-check-report.html; then
            echo "High or critical vulnerabilities detected!"
            exit 1
          fi

  spotbugs:
    name: SpotBugs Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain --no-build-cache
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: |
            **/spotbugs/main.html
            **/spotbugs/main.xml
          retention-days: 30

  semgrep:
    name: Semgrep Code Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep --config=auto --json --output=semgrep-results.json .
        continue-on-error: true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

      - name: Check for security findings
        if: always()
        run: |
          if [ -f semgrep-results.json ]; then
            ERRORS=$(cat semgrep-results.json | jq '.results | length')
            if [ "$ERRORS" -gt 0 ]; then
              echo "Semgrep found $ERRORS issues"
              cat semgrep-results.json | jq '.results[:5]'
            fi
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Review Dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severe-vulnerabilities: true
          deny-packages: |
            GPL-1.0
            GPL-2.0
            LGPL-2.0
            LGPL-2.1
            AGPL-1.0
            AGPL-2.0

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TruffleHog
        uses: edplato/trufflehog-actions-scan@master
        with:
          scanPath: '.'
          scanFilters: |
            - exclude: .git
            - exclude: node_modules
            - exclude: build
            - exclude: .gradle
          minMatchEntropy: 3.5

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [owasp-dependency-check, spotbugs, semgrep]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Summary Report
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Dependency Check | ${{ needs.owasp-dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SpotBugs | ${{ needs.spotbugs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
