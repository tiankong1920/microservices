services:
  postgres:
    image: postgres:18-alpine
    container_name: inventory-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=inventory_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-net-dev

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    ports:
      - "7379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - inventory-net-dev

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: inventory-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=
    networks:
      - inventory-net-dev

  product-service:
    build:
      context: .
      dockerfile: core-services/product-service/Dockerfile
    container_name: inventory-product-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=inventory_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
    networks:
      - inventory-net-dev

