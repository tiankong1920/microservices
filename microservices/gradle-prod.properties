org.gradle.jvmargs=-Xmx8g -Xms2g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

org.gradle.debug=false
org.gradle.profiling=false

spring.profiles.active=prod
spring.cloud.config.enabled=true

logging.level.root=WARN
logging.level.com.inventory=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

server.port=8080

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

nacos.config.server-addr=${NACOS_SERVER:localhost:8848}
nacos.config.namespace=${NACOS_NAMESPACE:production}
nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=0

database.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/inventory}
database.username=${DATABASE_USERNAME:postgres}
database.password=${DATABASE_PASSWORD:}
database.driver-class-name=org.postgresql.Driver
