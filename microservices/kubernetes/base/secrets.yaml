# ============================================================================
# Kubernetes Secrets — 密钥管理（生产环境请替换为外部密钥管理如 HashiCorp Vault）
# 使用方式：kubectl apply -f secrets.yaml -n inventory
# ⚠️ 此文件为模板，实际密钥值需通过 CI/CD 或密钥管理服务注入
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: inventory
  labels:
    app: inventory-system
    component: infrastructure
type: Opaque
stringData:
  username: "CHANGE_ME_DB_USERNAME"
  password: "CHANGE_ME_DB_PASSWORD"
  root-password: "CHANGE_ME_DB_ROOT_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-config
  namespace: inventory
  labels:
    app: inventory-system
    component: infrastructure
type: Opaque
stringData:
  host: "postgres"
  port: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: inventory
  labels:
    app: inventory-system
    component: security
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG!!"
  jwt-expiration: "86400000"
  refresh-token-expiration: "604800000"
  mfa-issuer: "InventorySystem"
---
apiVersion: v1
kind: Secret
metadata:
  name: cors-config
  namespace: inventory
  labels:
    app: inventory-system
    component: security
type: Opaque
stringData:
  allowed-origins: "https://admin.example.com,https://app.example.com"
  allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
  allowed-headers: "Authorization,Content-Type,X-Request-ID,X-API-Key"
  max-age: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-config
  namespace: inventory
  labels:
    app: inventory-system
    component: infrastructure
type: Opaque
stringData:
  password: "CHANGE_ME_REDIS_PASSWORD"
  host: "redis"
  port: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: nacos-config
  namespace: inventory
  labels:
    app: inventory-system
    component: infrastructure
type: Opaque
stringData:
  username: "nacos"
  password: "CHANGE_ME_NACOS_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: inventory
  labels:
    app: inventory-system
    component: infrastructure
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "CHANGE_ME_BASE64_ENCODED_DOCKER_CONFIG"
---
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-token
  namespace: inventory
  labels:
    app: inventory-system
    component: ci
type: Opaque
stringData:
  sonar-token: "CHANGE_ME_SONAR_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: ssl-certificate
  namespace: inventory
  labels:
    app: inventory-system
    component: security
type: kubernetes.io/tls
stringData:
  tls.crt: "CHANGE_ME_TLS_CERTIFICATE"
  tls.key: "CHANGE_ME_TLS_PRIVATE_KEY"
