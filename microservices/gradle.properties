# =============================================================================
# Gradle Build Performance Optimization Configuration
# 构建性能优化配置
# 版本: 1.0
# 更新日期: 2026-03-15
# =============================================================================

# -----------------------------------------------------------------------------
# JVM配置 - 内存和垃圾回收优化
# -----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./build/heap-dump.hprof -XX:+AlwaysPreTouch -XX:+OptimizeStringConcat

# -----------------------------------------------------------------------------
# 构建性能优化配置
# -----------------------------------------------------------------------------
# 启用并行构建 - 允许多个项目并行构建
org.gradle.parallel=true

# 启用构建缓存 - 重用之前构建的输出
org.gradle.caching=true

# 禁用配置缓存 - Gradle 8.10中与spring-dependency-management插件不兼容
org.gradle.unsafe.configuration-cache=false
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.max-problems=5

# 配置工作进程数 - 根据CPU核心数设置（建议为CPU核心数的1.5-2倍）
# 假设系统有8核CPU，设置为12-16个worker
org.gradle.workers.max=12

# 启用守护进程
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000

# 控制台输出模式
org.gradle.console=plain

# 警告模式
org.gradle.warning.mode=all

# 持续构建重载模式
org.gradle.continuous.reload-mode=swap

# 嵌入构建
org.gradle.embed.builds=true

# 构建优先级
org.gradle.priority=normal

# -----------------------------------------------------------------------------
# Java工具链配置
# -----------------------------------------------------------------------------
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# -----------------------------------------------------------------------------
# 项目基本信息
# -----------------------------------------------------------------------------
projectGroup=com.inventory
projectVersion=3.0.0

# -----------------------------------------------------------------------------
# 技术栈版本
# -----------------------------------------------------------------------------
javaVersion=21
springBootVersion=3.4.2
springCloudVersion=2024.0.2
springCloudAlibabaVersion=2023.0.1.0

# -----------------------------------------------------------------------------
# Kotlin配置
# -----------------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.jvm.toolchain.auto-download=true

# -----------------------------------------------------------------------------
# 日志配置
# -----------------------------------------------------------------------------
org.gradle.logging.console.enabled=true
org.gradle.logging.file.enabled=true
org.gradle.logging.file.path=./build/gradle.log

# -----------------------------------------------------------------------------
# 构建增强功能
# -----------------------------------------------------------------------------
org.gradle.buildReceipt=true
org.gradle.invocation.retry.count=3

# -----------------------------------------------------------------------------
# 测试配置
# -----------------------------------------------------------------------------
org.gradle.test.maxParallelForks=4
org.gradle.test.singleThreaded=false

# -----------------------------------------------------------------------------
# 安全审计配置
# -----------------------------------------------------------------------------
org.gradle.security.audit.level=summary
org.gradle.security.audit.download.location=https://github.com/gradle/gradle/raw/master/gradle/security/audit/plugin/build/reports/plugin/build/reports/dependency-license/dependency-license-report.txt

# -----------------------------------------------------------------------------
# IDE集成配置
# -----------------------------------------------------------------------------
org.gradle.ide.artifacts=true
org.gradle.ide.models=false

# -----------------------------------------------------------------------------
# 依赖解析配置
# -----------------------------------------------------------------------------
org.gradle.bundleresolver.enabled=true
org.gradle.dependency.verification=off

# -----------------------------------------------------------------------------
# 构建性能监控配置
# -----------------------------------------------------------------------------
# 启用构建扫描（用于性能分析）
org.gradle.build-scan.enabled=true
org.gradle.build-scan.terms-of-service.url=https://gradle.com/terms-of-service
org.gradle.build-scan.terms-of-service.agree=yes

# 构建性能指标收集
org.gradle.metrics.enabled=true
org.gradle.metrics.reporting.enabled=true

# -----------------------------------------------------------------------------
# 仓库访问优化配置
# -----------------------------------------------------------------------------
# 仓库连接超时设置（毫秒）
org.gradle.internal.network.retry.max.attempts=3
org.gradle.internal.network.timeout=30000
org.gradle.internal.network.connect.timeout=30000

# 依赖缓存配置
org.gradle.internal.publish.checksums.insecure=true
org.gradle.internal.repository.max.retries=3
org.gradle.internal.repository.initial.backoff=1000

# -----------------------------------------------------------------------------
# 性能调优备注
# -----------------------------------------------------------------------------
# 1. workers.max=12: 基于8核CPU，设置为12个worker（1.5倍）
# 2. 配置缓存: 启用后可显著减少配置阶段时间
# 3. 构建缓存: 重用之前构建的输出，减少重复工作
# 4. 并行构建: 允许多个项目同时构建，提高整体构建速度
# 5. JVM参数优化: 使用G1垃圾收集器，优化字符串操作
# 
# 监控指标:
# - 配置阶段耗时: 目标 < 5秒
# - 执行阶段耗时: 目标 < 2分钟（clean build）
# - 总构建时间: 目标 < 3分钟
# - 内存使用: 峰值 < 4GB
# -----------------------------------------------------------------------------
