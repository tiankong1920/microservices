---
spring:
  application:
    name: SERVICE_NAME_PLACEHOLDER
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: GROUP_NAME_PLACEHOLDER
        metadata:
          version: 3.0.0
          env: ${SPRING_PROFILES_ACTIVE:dev}
          service-type: microservice
          framework: spring-boot
          language: java
          team: inventory-management
          region: default
          zone: default
          stage: ${SPRING_PROFILES_ACTIVE:dev}
          gray: false
          weight: 1.0
      config:
        server-addr: localhost:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: GROUP_NAME_PLACEHOLDER
        file-extension: yml
        refresh-enabled: true
        encode: UTF-8
server:
  port: 8080
