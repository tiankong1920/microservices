---
server:
  port: 8080
spring:
  application:
    name: cross-service-tests
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: null
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    discovery:
      client:
        enabled: false
    config:
      enabled: false
  test:
    resttemplate:
      max-connections: 100
      max-connections-per-route: 20
  jackson:
    serialization:
      indent-output: true
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
test:
  services:
    sales-service:
      url: http://localhost:8081
    order-service:
      url: http://localhost:8082
    inventory-service:
      url: http://localhost:8083
    finance-service:
      url: http://localhost:8084
    product-service:
      url: http://localhost:8085
    customer-service:
      url: http://localhost:8086
    config-service:
      url: http://localhost:8888
    registry-service:
      url: http://localhost:8761
    gateway-service:
      url: http://localhost:8080
  timeout:
    default: 30000
    long: 60000
  service:
    wait-time: 5000
  data:
    init: true
    cleanup: true
logging:
  level:
    com.inventory: DEBUG
    org.springframework: INFO
    org.springframework.web: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
