# Cross-service test configuration

# Server configuration
server.port=8080
spring.application.name=cross-service-tests

# Test services URLs
# These should point to the actual running services in the test environment
test.services.sales-service.url=http://localhost:8081
test.services.order-service.url=http://localhost:8082
test.services.inventory-service.url=http://localhost:8083
test.services.finance-service.url=http://localhost:8084
test.services.product-service.url=http://localhost:8085
test.services.customer-service.url=http://localhost:8086
test.services.config-service.url=http://localhost:8888
test.services.registry-service.url=http://localhost:8761
test.services.gateway-service.url=http://localhost:8080

# Test database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Eureka client configuration
spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.discovery.client.enabled=false

# Config client configuration
spring.cloud.config.enabled=false

# TestRestTemplate configuration
spring.test.resttemplate.max-connections=100
spring.test.resttemplate.max-connections-per-route=20

# Jackson configuration
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging configuration
logging.level.com.inventory=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Test timeout settings
test.timeout.default=30000
test.timeout.long=60000

# Service wait time
test.service.wait-time=5000

# Test data settings
test.data.init=true
test.data.cleanup=true