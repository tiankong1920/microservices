---
spring:
  application:
    name: inventory-management-system
  profiles:
    active: dev
  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 20
logging:
  level:
    root: INFO
    com.inventory: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.apache: WARN
    com.fasterxml: WARN
    io.netty: WARN
    io.github.resilience4j: INFO
  json:
    enabled: true
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}:%L - [app=%X{appName:-${spring.application.name}},
      requestId=%X{requestId:-N/A}, userId=%X{userId:-N/A}] %msg%n%ex{full}'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}:%L - [app=%X{appName:-${spring.application.name}},
      requestId=%X{requestId:-N/A}, userId=%X{userId:-N/A}] %msg%n%ex{full}'
  file:
    name: logs/${spring.application.name}.log
    max-size: 500MB
    max-history: 30
    total-size-cap: 50GB
    clean-history-true-start: false
  logstash:
    host: ${LOGSTASH_HOST:localhost}
    port: ${LOGSTASH_PORT:5044}
    enabled: ${LOGSTASH_ENABLED:false}
    queue-size: 512
    connect-timeout: 5000
    socket-timeout: 5000
    keep-alive-timeout: 60000
    include-context: true
    include-mdc: true
    include-call-stack: true
    include-tags: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  info:
    title: Inventory Management System API
    description: REST API for Inventory Management System
    version: ${project.version}
resilience4j:
  circuitbreaker:
    instances:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        sliding-window-size: 100
        minimum-number-of-calls: 10
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      default:
        limit-refresh-period: 1s
        limit-for-period: 100
        timeout-duration: 500ms
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://inventory.yourcompany.com}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,X-CSRF-Token
    allow-credentials: true
    max-age: 3600
